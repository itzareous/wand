# XcodeGen spec — run `xcodegen generate` to create Wand.xcodeproj (not committed).
name: Wand
options:
  bundleIdPrefix: com.qorelly.wand
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 39BCSX9U5C # Abdul Ahmad (Personal Team, free: device installs expire after 7 days)
    CODE_SIGN_STYLE: Automatic
packages:
  RemoteKit:
    path: packages/RemoteKit
targets:
  Wand:
    type: application
    platform: iOS
    sources: [apps/ios/Sources]
    dependencies:
      - package: RemoteKit
    info:
      path: apps/ios/Info.plist
      properties:
        CFBundleDisplayName: Wand
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Wand finds and controls your computer on this Wi-Fi network.
        NSBonjourServices: [_wand._tcp]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qorelly.wand
        TARGETED_DEVICE_FAMILY: "1"
  WandMac:
    type: application
    platform: macOS
    sources: [apps/mac-agent/Sources]
    dependencies:
      - package: RemoteKit
    info:
      path: apps/mac-agent/Info.plist
      properties:
        CFBundleDisplayName: Wand
        LSUIElement: true
        NSLocalNetworkUsageDescription: Wand lets your phone control this Mac over Wi-Fi.
        NSBonjourServices: [_wand._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qorelly.wand.mac
        PRODUCT_NAME: Wand
        # Not sandboxed on purpose: media-key events and (later) screen capture need it.
        # Distribute outside the Mac App Store, notarized (see docs/roadmap.md).
        ENABLE_APP_SANDBOX: NO
