# XcodeGen spec — run `xcodegen generate` to create Remote.xcodeproj (not committed).
name: Remote
options:
  bundleIdPrefix: com.qorelly.remote
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your Apple team ID on the build Mac
packages:
  RemoteKit:
    path: packages/RemoteKit
targets:
  RemoteiOS:
    type: application
    platform: iOS
    sources: [apps/ios/Sources]
    dependencies:
      - package: RemoteKit
    info:
      path: apps/ios/Info.plist
      properties:
        CFBundleDisplayName: Remote
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Remote finds and controls your computer on this Wi-Fi network.
        NSBonjourServices: [_tbremote._tcp]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qorelly.remote.ios
        TARGETED_DEVICE_FAMILY: "1"
  RemoteMacAgent:
    type: application
    platform: macOS
    sources: [apps/mac-agent/Sources]
    dependencies:
      - package: RemoteKit
    info:
      path: apps/mac-agent/Info.plist
      properties:
        CFBundleDisplayName: Remote Agent
        LSUIElement: true
        NSLocalNetworkUsageDescription: Remote Agent lets your phone control this Mac over Wi-Fi.
        NSBonjourServices: [_tbremote._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qorelly.remote.agent
        # Not sandboxed on purpose: media-key events and (later) screen capture need it.
        # Distribute outside the Mac App Store, notarized (see docs/roadmap.md).
        ENABLE_APP_SANDBOX: NO
